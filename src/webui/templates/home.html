      .dark {

        --text-secondary: #b3b3b3;
        --text-muted: #808080;

        --accent-dark: #0099cc;
        --accent-light: #33e5ff;

        --glow: rgba(0, 217, 255, 0.1);

        --muted: var(--bg-tertiary);

  <body>
    <header class="app-header" id="appHeader">
      <h1>Sequel2SQL</h1>
    </header>

    <div id="root"></div>

    <div class="prompts-container" id="promptsContainer">
      <button class="prompt-btn" data-prompt="How does Sequel2SQL work?">Explain Sequel2SQL</button>
      <button class="prompt-btn" data-prompt="Explore the database schema">Explore this database</button>
      <button class="prompt-btn" data-prompt="What tools do you have access to?">What tools do you have access to?</button>
    </div>

    <script>
      const appHeader = document.getElementById("appHeader");
      const promptsContainer = document.getElementById("promptsContainer");
      const urlPrompt = new URLSearchParams(window.location.search).get("prompt");
      let hasUserMessage = sessionStorage.getItem("messageWasSent") === "true";
      const isHomePage = window.location.pathname === "/";

      function hideHeaderAfterMessage() {
        if (appHeader && !hasUserMessage) {
          appHeader.classList.add("hidden");
          promptsContainer.classList.add("hidden");
          hasUserMessage = true;
          sessionStorage.setItem("messageWasSent", "true");
        }
      }

      // Hide header and prompts if not on home page or if message was already sent
      function initializeHomeElements() {
        if (!isHomePage || hasUserMessage) {
          if (appHeader) appHeader.classList.add("hidden");
          if (promptsContainer) promptsContainer.classList.add("hidden");
        }
      }

      // Initialize on page load
      initializeHomeElements();

      function findComposer() {
        return (
          document.querySelector("textarea") ||
          document.querySelector('input[type="text"], input[placeholder*="message" i]')
        );
      }

      function findSendButton() {
        return (
          document.querySelector('button[type="submit"]') ||
          document.querySelector('button[aria-label*="send" i]') ||
          document.querySelector('button[title*="send" i]')
        );
      }

      function applyPromptToComposer(value) {
        const composer = findComposer();
        if (!composer) {
          return false;
        }

        composer.focus();

        const textAreaSetter = Object.getOwnPropertyDescriptor(
          HTMLTextAreaElement.prototype,
          "value",
        )?.set;
        const inputSetter = Object.getOwnPropertyDescriptor(
          HTMLInputElement.prototype,
          "value",
        )?.set;
        const setter = textAreaSetter || inputSetter;

        if (setter) {
          setter.call(composer, value);
        } else {
          composer.value = value;
        }

        composer.dispatchEvent(new Event("input", { bubbles: true }));
        composer.dispatchEvent(new Event("change", { bubbles: true }));

        return true;
      }

      function submitPrompt(value) {
        if (!applyPromptToComposer(value)) {
          return false;
        }

        const composer = findComposer();
        if (!composer) {
          return false;
        }

        const form = composer.closest("form");
        if (form) {
          form.requestSubmit();
          hideHeaderAfterMessage();
          return true;
        }

        const button = findSendButton();
        if (button) {
          button.click();
          hideHeaderAfterMessage();
          return true;
        }

        return false;
      }

      function queuePrompt(prompt) {
        let attempts = 0;
        const interval = window.setInterval(() => {
          attempts += 1;

          if (submitPrompt(prompt) || attempts >= 28) {
            window.clearInterval(interval);
          }
        }, 220);
      }

      /* Prompt button click handling */
      document.querySelectorAll(".prompt-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const prompt = btn.getAttribute("data-prompt");
          if (prompt) {
            queuePrompt(prompt);
          }
        });
      });

      /* Hide header and detect messages */
      document.addEventListener("submit", () => {
        hideHeaderAfterMessage();
      }, true);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && document.activeElement instanceof HTMLTextAreaElement) {
          hideHeaderAfterMessage();
        }
      });

      /* Handle URL prompt if passed */
      if (urlPrompt) {
        hideHeaderAfterMessage();
        queuePrompt(urlPrompt);
        history.replaceState({}, "", window.location.pathname);
      }
    </script>
  </body>
</html>
