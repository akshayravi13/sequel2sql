site_name: Sequel2SQL
site_description: Final report and technical documentation for Sequel2SQL
site_url: https://svijayb.github.io/sequel2sql/
repo_url: https://github.com/SVijayB/sequel2sql
repo_name: SVijayB/sequel2sql
edit_uri: edit/final-changes/docs/

docs_dir: .
site_dir: ../site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - search.suggest
    - search.highlight
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      block_tag: 'div'
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 2-3

nav:
  - Home: index.md
  - Final Report: deliverables/final-report.md
  - Quickstart: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
      - Component Map: architecture/components.md
  - Benchmark:
      - Evaluation and Findings: benchmark/overview.md
  - API and Tools: api/index.md
  - Development Guide: guides/development.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SVijayB/sequel2sql

copyright: Copyright 2026 Sequel2SQL Contributors.
